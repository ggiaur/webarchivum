version: '3.8'

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: fewa-postgres-test
    environment:
      POSTGRES_DB: fewa_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - ./spec/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d fewa_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: fewa-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio-test:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: fewa-minio-test
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: miniotestadmin
      MINIO_ROOT_PASSWORD: miniotestpassword
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend-test:
    build:
      context: ./fewa-v3-backend
      dockerfile: Dockerfile
    container_name: fewa-backend-test
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=testing
      - LOG_LEVEL=DEBUG
      - POSTGRES_HOST=postgres-test
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fewa_test_db
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio-test:9000
      - MINIO_ACCESS_KEY=miniotestadmin
      - MINIO_SECRET_KEY=miniotestpassword
      - MINIO_BUCKET_NAME=fewa-wacz-test-storage
      - JWT_SECRET_KEY=test-secret-key-super-secure-key-32chars-min!
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
